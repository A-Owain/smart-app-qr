<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart App QR Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827;padding:40px 20px}
    .wrap{max-width:820px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(17,24,39,.08)}
    h1{margin:0 0 8px;font-size:30px}h2{font-size:18px;margin:0 0 10px}p{color:#6b7280;line-height:1.55}
    label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
    button{width:100%;border:0;border-radius:10px;padding:14px 16px;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px;background:#111827;color:white}
    .secondary{background:#eef0f4;color:#111827}.box{margin-top:22px;padding:18px;border:1px solid #e5e7eb;border-radius:12px;background:#fafafa}
    .url{word-break:break-all;font-family:monospace;background:white;border:1px solid #e5e7eb;padding:12px;border-radius:8px;font-size:13px}
    .hidden{display:none}#qrcode{display:flex;justify-content:center;padding:22px 0 8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:650px){.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Smart App QR Generator</h1>
  <p>One QR code. iPhone opens the App Store, Android opens Google Play. No extra redirect files to upload.</p>

  <label>App Name</label>
  <input id="appName" placeholder="Tawuniya">

  <label>App Store URL</label>
  <input id="ios" placeholder="https://apps.apple.com/...">

  <label>Google Play URL</label>
  <input id="android" placeholder="https://play.google.com/store/apps/details?id=...">

  <label>Fallback URL (optional)</label>
  <input id="fallback" placeholder="https://yourwebsite.com">

  <button onclick="build()">Generate Smart QR</button>

  <div id="result" class="hidden">
    <div class="box">
      <h2>Smart redirect URL</h2>
      <div id="finalUrl" class="url"></div>
    </div>

    <div class="box">
      <h2>QR Code</h2>
      <div id="qrcode"></div>
      <div class="actions">
        <button class="secondary" onclick="downloadPNG()">Download PNG</button>
        <button class="secondary" onclick="downloadSVG()">Download SVG</button>
      </div>
    </div>
  </div>
</div></div>

<script>
  let qrInstance = null;
  let currentUrl = '';
  let currentSlug = 'app';

  function slugify(text){
    return text.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'app';
  }

  function build(){
    const appName = document.getElementById('appName').value.trim();
    const ios = document.getElementById('ios').value.trim();
    const android = document.getElementById('android').value.trim();
    const fallback = document.getElementById('fallback').value.trim();

    if(!appName || !ios || !android){
      alert('Please enter the app name, App Store URL, and Google Play URL.');
      return;
    }

    currentSlug = slugify(appName);

    const base = new URL('redirect.html', window.location.href);
    base.searchParams.set('ios', ios);
    base.searchParams.set('android', android);
    if(fallback) base.searchParams.set('fallback', fallback);

    currentUrl = base.toString();
    document.getElementById('finalUrl').textContent = currentUrl;

    const qr = document.getElementById('qrcode');
    qr.innerHTML = '';
    qrInstance = new QRCode(qr, {
      text: currentUrl,
      width: 280,
      height: 280,
      correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('result').classList.remove('hidden');
  }

  function downloadPNG(){
    if(!qrInstance) return;
    const qr = document.getElementById('qrcode');
    const canvas = qr.querySelector('canvas');
    const img = qr.querySelector('img');
    const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : '');
    if(!dataUrl) return;

    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = currentSlug + '-qr.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function downloadSVG(){
    if(!qrInstance || !qrInstance._oQRCode){
      alert('Generate the QR first.');
      return;
    }

    const model = qrInstance._oQRCode;
    const count = model.getModuleCount();
    const border = 4;
    const size = count + border * 2;
    let path = '';

    for(let row = 0; row < count; row++){
      for(let col = 0; col < count; col++){
        if(model.isDark(row, col)){
          path += 'M' + (col + border) + ' ' + (row + border) + 'h1v1h-1z';
        }
      }
    }

    const svg =
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges">' +
      '<rect width="100%" height="100%" fill="#fff"/>' +
      '<path d="' + path + '" fill="#000"/>' +
      '</svg>';

    const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentSlug + '-qr.svg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
